services:
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-us5.datadoghq.com}
      # sem isso o agent morre em ambientes sem hostname resolvível (ex. WSL2/containers)
      DD_HOSTNAME: video-processor-local
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_APM_ENABLED: "false"
      DD_LOGS_ENABLED: "false"
      DD_PROCESS_AGENT_ENABLED: "false"
    ports:
      - "8125:8125/udp"
    networks: [vpw-net]

  localstack:
    image: localstack/localstack-pro:2026.06
    environment:
      SERVICES: s3,sqs
      DEBUG: 1
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
    ports:
      - "4566:4566"
    networks: [vpw-net]

  bootstrap:
    image: amazon/aws-cli:latest
    depends_on:
      - localstack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: video-processor-bucket
    volumes:
      - ./deploy/localstack:/bootstrap
    entrypoint: ["/bootstrap/bootstrap.sh"]
    networks: [vpw-net]

networks:
  vpw-net:
    name: vpw-net
    driver: bridge
