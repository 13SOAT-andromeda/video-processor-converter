sonar.projectKey=13SOAT-andromeda_video-processor-converter
sonar.organization=13soat-andromeda
sonar.projectName=video-processor-converter
sonar.projectVersion=1.0

sonar.sources=.
sonar.exclusions=**/*_test.go,**/mocks/**,**/cmd/**,**/context/**,**/test/**,**/Dockerfile*

sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
sonar.sourceEncoding=UTF-8

# object_storage.go e status_publisher.go só envolvem *awss3.Client/*awssqs.Client
# reais (sem interface pra mockar) — cobertos de verdade por
# test/integration/worker_integration_test.go (LocalStack), que roda com
# -tags=integration e não entra no coverage.out gerado no CI.
sonar.coverage.exclusions=**/adapter/s3/**,**/adapter/sqs/**
